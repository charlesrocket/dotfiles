---
"on":
  push:
  pull_request:

name: ShellCheck
permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell:
          - sh
          - bash
          - dash
          - ksh

    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: "-s ${{ matrix.shell }}"
        with:
          ignore_names: .zshrc
