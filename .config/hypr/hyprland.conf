monitor=,preferred,auto,1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1

exec-once = hyprctl setcursor Bibata-Original-Classic 20
exec-once = ~/bin/desktop-startup

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(4e4e4eaa)
    col.inactive_border = rgba(4e4e4eaa)
    layout = dwindle
}

decoration {
    rounding = 8
    dim_inactive = false
    dim_strength = 0.1

    shadow {
        enabled = false
        range = 6
        render_power = 5
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = yes
        size = 2
        passes = 3
        ignore_opacity = true
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    force_split = 2
    pseudotile = false
    preserve_split = false
}

input {
    kb_layout = us,no
    kb_options = grp:alt_shift_toggle

    sensitivity = 0
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

cursor {
    inactive_timeout = 5
}

gestures {
    gesture = 3, horizontal, workspace
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
    enforce_permissions = true
}

misc {
    disable_autoreload = true
    disable_hyprland_logo = true
}

xwayland {
    enabled = true
    use_nearest_neighbor = true
    force_zero_scaling = true
}

$mod = SUPER

layerrule = blur on, match:namespace notifications
layerrule = blur on, match:namespace quickshell
layerrule = blur on, match:namespace eww-bar
layerrule = blur on, match:namespace rofi
layerrule = blur on, match:namespace logout_dialog
layerrule = ignore_alpha 0, match:namespace quickshell

windowrule = no_blur off, match:class ^(.*)$
windowrule = no_blur off, match:class com.mitchellh.ghostty
windowrule = no_blur off, match:class Alacritty
windowrule = no_blur off, match:class foot
windowrule = no_blur off, match:class dev.zed.Zed
windowrule = maximize on, match:class ghidra-Ghidra

windowrule = workspace 1, match:class Signal
windowrule = workspace 2, match:class com.mitchellh.ghostty
windowrule = workspace 2, match:class Alacritty
windowrule = workspace 2, match:class foot
windowrule = workspace 3, match:class firefox
windowrule = workspace 4, match:class emacs
windowrule = workspace 4, match:class dev.zed.Zed
windowrule = workspace 5, match:class gedit
windowrule = workspace 6, match:class thunar
windowrule = workspace 7, match:class Claws-mail
windowrule = workspace 8, match:class blender
windowrule = workspace 8, match:class vlc
windowrule = workspace 8, match:class mpv
windowrule = workspace 9, match:class org.nicotine_plus.Nicotine

bind = $mod, RETURN, exec, foot
bind = $mod, F2, exec, foot
bind = $mod, F3, exec, firefox
bind = $mod, F4, exec, zedit
bind = $mod, F5, exec, gedit
bind = $mod, F6, exec, thunar
bind = $mod, F7, exec, claws-mail
bind = $mod, Q, killactive,
bind = $mod, K, exec, hyprctl reload,
bind = $mod, R, exec, quickshell ipc call topbar logout
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen
bind = $mod, D, exec, rofi -show drun
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, right, workspace, e+1
bind = $mod, left, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, M, submap, resize

submap = resize

binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , escape, submap, reset

submap = reset

bind = , XF86MonBrightnessUp, exec, backlight +
bind = , XF86MonBrightnessDown, exec, backlight -
bind = , XF86AudioRaiseVolume, exec, quickshell ipc call audio volumeUp
bind = , XF86AudioLowerVolume, exec, quickshell ipc call audio volumeDown
bind = , XF86AudioMute, exec, quickshell ipc call audio toggleMute

permission = *, screencopy, ask
permission = *, keyboard, ask
permission = *, plugin, ask

permission = /usr/local/bin/hyprlock, screencopy, allow
permission = /usr/local/bin/grim, screencopy, allow
